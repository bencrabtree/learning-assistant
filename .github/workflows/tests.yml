name: Tests & Quality Checks

on:
  pull_request:
  push:
    branches: [ main, claude/* ]
  workflow_dispatch:

jobs:
  # ===========================
  # Code Quality Checks
  # ===========================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff isort mypy

      - name: Check formatting with Black
        run: black --check --line-length=100 .

      - name: Check import sorting with isort
        run: isort --check-only --profile=black --line-length=100 .

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type check with MyPy
        run: mypy src/ --config-file=pyproject.toml || true  # Don't fail on type errors yet

  # ===========================
  # Security Checks
  # ===========================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: bandit -r src/ -c pyproject.toml

  # ===========================
  # Tests with Coverage
  # ===========================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ===========================
  # Integration Tests (Longer Running)
  # ===========================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run integration tests
        run: pytest tests/ -v -m integration --tb=short
        env:
          # Mock API keys for integration tests
          ANTHROPIC_API_KEY: "test-key"
          TWITTER_BEARER_TOKEN: "test-token"

  # ===========================
  # All Checks Passed
  # ===========================
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, security, test, integration]
    steps:
      - name: Success
        run: echo "All quality checks passed! 🎉"